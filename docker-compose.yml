volumes:
  ams_postgres_data: {}
  ams_redis_data: {}
  ams_discourse_data: {}
  ams_discourse_postgres: {}
  ams_discourse_postgres_data: {}
  ams_file_store_data: {}
  ams_node_modules: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: ams_django
    container_name: ams_django
    depends_on:
      postgres:
        condition: service_started
      mailpit:
        condition: service_started
      file-store-init:
        condition: service_completed_successfully
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/django.ini
      - ./.envs/.local/postgres.ini
      - path: ./.envs/.local/django-private.ini
        required: false
    command: sleep infinity

  postgres:
    image: docker.io/postgres:17
    container_name: ams_postgres
    volumes:
      - ams_postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    env_file:
      - ./.envs/.local/postgres.ini

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: ams_mailpit
    ports:
      - '8025:8025'

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: ams_node
    container_name: ams_node
    volumes:
      - .:/app:z
      - ams_node_modules:/app/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
    command: npm run dev
    ports:
      - '3000:3000'
      # Expose browsersync UI: https://www.browsersync.io/docs/options/#option-ui
      - '3001:3001'

  discourse:
    image: discourse/discourse:2026.1.5
    container_name: ams_discourse
    depends_on:
      - discourse_postgres
      - redis
      - mailpit
    ports:
      - '80:80'
    volumes:
      - ams_discourse_data:/shared
    env_file:
      - ./.envs/.local/discourse.ini

  discourse_init:
    image: discourse/discourse:2026.1.5
    container_name: ams_discourse_init
    depends_on:
      - discourse
    volumes:
      - ams_discourse_data:/shared
      - ./compose/local/discourse/discourse-init.rb:/usr/local/bin/discourse-init.rb:ro
      - ./compose/local/discourse/run-init.sh:/usr/local/bin/run-init.sh:ro
    env_file:
      - ./.envs/.local/discourse.ini
    entrypoint: ['bash', '-lc']
    command: '/usr/local/bin/run-init.sh'

  discourse_postgres:
    image: discourse/postgres
    container_name: ams_discourse_postgres
    volumes:
      - ams_discourse_postgres:/var/lib/postgresql
      - ams_discourse_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.local/discourse_postgres.ini

  redis:
    image: redis:7-alpine
    container_name: ams_redis
    volumes:
      - ams_redis_data:/data
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  docs:
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    image: ams_docs
    container_name: ams_docs
    ports:
      - '8001:8000'
    volumes:
      - ./docs/:/docs:z

  file-store:
    image: rustfs/rustfs:1.0.1
    container_name: ams_file_store
    command: ['/data']
    env_file:
      - ./.envs/.local/file-store.ini
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - ams_file_store_data:/data
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  file-store-init:
    image: rustfs/rc:v0.1.36
    container_name: ams_file_store_init
    depends_on:
      file-store:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/file-store-init.sh']
    volumes:
      - ./compose/local/file-store/file-store-init.sh:/file-store-init.sh:ro
    env_file:
      - ./.envs/.local/file-store.ini
    environment:
      FILE_STORE_ENDPOINT_URL: http://file-store:9000
    restart: 'no'
