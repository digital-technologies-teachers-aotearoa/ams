site_name: Association Management System Documentation
site_url: https://digital-technologies-teachers-aotearoa.github.io/ams/
repo_url: https://github.com/digital-technologies-teachers-aotearoa/ams
repo_name: AMS on GitHub

theme:
  name: material
  custom_dir: overrides
  features:
    - toc.follow
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc
    # permalink: true

plugins:
  - search
  - glightbox
  - macros:
      render_by_default: false

nav:
  - Home: index.md
  - Features: features.md
  - Getting started:
      - getting-started/index.md
      - getting-started/decision-questionnaire.md
      - getting-started/costs-sheet.md
      - getting-started/accounts-checklist.md
      - getting-started/working-with-designers.md
      - getting-started/settings-glossary.md
      - getting-started/glossary.md
  - Your website:
      - website/index.md
      - Setup guide:
          - website/setup/index.md
          - website/setup/orientation.md
          - website/setup/branding-theme.md
          - website/setup/first-pages.md
          - website/setup/navigation-menus.md
          - website/setup/languages-translations.md
          - website/setup/memberships.md
          - website/setup/forum.md
          - website/setup/events.md
          - website/setup/resources.md
          - website/setup/inviting-your-team.md
          - website/setup/launch-checklist.md
      - Feature reference:
          - website/reference/index.md
          - website/reference/cms.md
          - website/reference/events.md
          - website/reference/resources.md
          - website/reference/forum.md
          - website/reference/theme-customization.md
  - Hosting AMS:
      - hosting/index.md
      - hosting/deployment.md
      - hosting/provisioning-runbook.md
      - hosting/xero-billing.md
      - hosting/client-communication-templates.md
  - Developing AMS:
      - developer/index.md
      - developer/contributing.md
      - developer/docs-conventions.md
      - developer/feature-flags.md
      - developer/resources.md
      - developer/billing.md
      - developer/management-commands-catalog.md
      - developer/forum.md
      - developer/icons.md
      - developer/urls.md
      - developer/permission-caching.md
      - developer/project-dev-site.md
      - developer/wagtail-cms.md
      - developer/theme-system.md
      - developer/email-templates.md
