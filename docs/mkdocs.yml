site_name: Association Management System Documentation
site_url: https://digital-technologies-teachers-aotearoa.github.io/ams/
repo_url: https://github.com/digital-technologies-teachers-aotearoa/ams
repo_name: AMS on GitHub

theme:
  name: material
  custom_dir: overrides
  features:
    - toc.follow
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc
    # permalink: true

plugins:
  - search
  - glightbox
  - macros:
      render_by_default: false

nav:
  - Home: index.md
  - Features: features.md
  - Getting started:
      - getting-started/index.md
      - getting-started/decision-questionnaire.md
      - getting-started/costs-sheet.md
      - getting-started/accounts-checklist.md
      - getting-started/working-with-designers.md
      - getting-started/settings-glossary.md
      - getting-started/glossary.md
  - Building your website:
      - tutorials/index.md
      - tutorials/orientation.md
      - tutorials/branding-theme.md
  - Website administrator guide:
      - admin/index.md
      - admin/cms.md
      - admin/events.md
      - admin/resources.md
      - admin/forum.md
      - admin/xero-billing.md
      - admin/theme-customization.md
  - Provider guide:
      - provider/index.md
      - provider/provisioning-runbook.md
      - provider/client-communication-templates.md
  - Developer documentation:
      - developer/contributing.md
      - developer/docs-conventions.md
      - developer/feature-flags.md
      - developer/resources.md
      - developer/billing.md
      - developer/management-commands-catalog.md
      - developer/forum.md
      - developer/icons.md
      - developer/urls.md
      - developer/permission-caching.md
      - developer/deployment.md
      - developer/project-dev-site.md
      - developer/wagtail-cms.md
      - developer/theme-system.md
      - developer/email-templates.md
