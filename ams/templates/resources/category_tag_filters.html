{% load i18n %}

{% for category in form.categories %}
  <div class="mb-3">
    <button type="button"
            class="resource-tag-category-toggle text-uppercase small fw-semibold text-muted mb-1"
            data-category-toggle="{{ category.pk }}"
            aria-pressed="false">
      {{ category.name }}
      <span class="visually-hidden">{% trans "Select all tags in this category" %}</span>
    </button>
    <div class="d-flex flex-wrap column-gap-2 row-gap-1">
      {% for tag in category.tags.all %}
        <div class="resource-tag-check">
          <input class="visually-hidden"
                 type="checkbox"
                 name="tag"
                 value="{{ tag.pk }}"
                 id="tag_{{ tag.pk }}"
                 data-tag-category="{{ category.pk }}"
                 autocomplete="off"
                 {% if tag.pk in selected_tag_pks %}checked{% endif %} />
          <label for="tag_{{ tag.pk }}">{% include "resources/_tag_badge.html" with no_link=True %}</label>
        </div>
      {% endfor %}
    </div>
  </div>
{% endfor %}
